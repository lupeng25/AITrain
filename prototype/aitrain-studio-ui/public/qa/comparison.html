<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AITrain Studio 设计对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111827; color: #e5e7eb; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    header { height: 56px; display: flex; align-items: center; justify-content: space-around; font-size: 15px; font-weight: 700; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; height: calc(100vh - 56px); }
    figure { margin: 0; min-width: 0; background: #0b1220; display: flex; flex-direction: column; }
    img { width: 100%; height: 100%; object-fit: contain; object-position: top center; }
  </style>
</head>
<body>
  <header><span>方案 1 原始设计基准</span><span>1440×1024 HTML 实现</span></header>
  <main>
    <figure><img src="/qa/option-1.png" alt="方案 1 原始设计基准" /></figure>
    <figure><img src="/qa/training-1440x1024.png" alt="AITrain Studio HTML 实现" /></figure>
  </main>
</body>
</html>
